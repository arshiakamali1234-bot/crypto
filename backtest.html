<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V28 Backtest Lab</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#0b0f14;color:#e7edf5;margin:0;padding:20px}.wrap{max-width:980px;margin:auto}.card{background:#11161d;border:1px solid #293241;border-radius:14px;padding:16px;margin:12px 0}.btn{background:#2b7fff;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.muted{color:#9ba7b6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #222b36;padding:8px 0;gap:12px}.pass{color:#55d68a}.fail{color:#ff6b7a}.warn{color:#ffd166}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #293241;text-align:right}.small{font-size:12px}.bar{height:8px;background:#202733;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:#4da3ff}</style></head>
<body><div class="wrap"><h1>🧪 V28 Backtest Lab</h1><p class="muted">اعتبارسنجی واقعی موتور V27 با داده تاریخی Binance. اجرای سیگنال روی کندل بعدی، کارمزد و اسلیپیج، OOS و Precision Gate. این صفحه سفارش واقعی ارسال نمی‌کند.</p>
<div class="card"><div class="grid"><label>تایم‌فریم<select id="tf"><option>1h</option><option>15m</option><option>4h</option></select></label><label>تعداد کندل هدف<input id="bars" type="number" value="5000" min="500" max="10000"></label></div><br><button class="btn" id="run">شروع بک‌تست واقعی</button><span id="status" class="muted" style="margin-right:10px"></span></div>
<div class="card"><h2>نتایج</h2><div id="out" class="muted">هنوز اجرا نشده.</div></div></div>
<script src="app.js"></script><script>
const symbols=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','LINKUSDT','XRPUSDT'];
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function fetchHist(symbol,interval,target){let all=[];let end=Date.now();while(all.length<target){const lim=Math.min(1000,target-all.length);const u=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${lim}&endTime=${end}`;const r=await fetch(u);if(!r.ok)throw Error(symbol+' HTTP '+r.status);const raw=await r.json();if(!raw.length)break;const mapped=raw.map(k=>({time:+k[0],closeTime:+k[6],open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));const before=all.length;all=mapped.concat(all);end=mapped[0][0]-1;if(all.length===before)break;if(mapped.length<lim)break;}return all.slice(-target);}
function pct(x){return Number.isFinite(x)?(x*100).toFixed(2)+'%':'—'} function f(x){return Number.isFinite(x)?Number(x).toFixed(3):'—'}
async function run(){const e=window.__V28_ENGINE;if(!e){$('status').textContent='Engine bridge not loaded';return} $('run').disabled=true; const tf=$('tf').value,target=+$('bars').value; const rows=[]; try{for(let n=0;n<symbols.length;n++){const s=symbols[n];$('status').textContent=`${n+1}/${symbols.length} — دریافت ${s}...`;const c=await fetchHist(s,tf,target);$('status').textContent=`${n+1}/${symbols.length} — replay ${s} (${c.length} candles)...`;const replay=e.trueEngineReplayV11(c);const oos=e.pPurgedWalkForward(c);const cal=e.pCalibration(replay.tradesDetail||[]);const ci=e.pBootstrapCI(replay.tradesDetail||[]);const perm=e.pPermutationTest(replay.tradesDetail||[]);const anomaly=e.pAnomalyScan(c);const gate=e.pPrecisionGate({replay,oos,cal,ci,perm,anomaly,reg:oos});rows.push({s,c,replay,oos,cal,ci,perm,anomaly,gate});}}
$('status').textContent='تمام شد.';let html='<table><tr><th>ارز</th><th>کندل</th><th>معامله</th><th>Win Rate</th><th>PF</th><th>Expectancy</th><th>Max DD</th><th>OOS</th><th>Gate</th></tr>';for(const x of rows){html+=`<tr><td><b>${x.s}</b></td><td>${x.c.length}</td><td>${x.replay.trades}</td><td>${x.replay.winRate.toFixed(1)}%</td><td>${f(x.replay.profitFactor)}</td><td>${pct(x.replay.expectancy)}</td><td>${x.replay.maxDrawdown.toFixed(1)}%</td><td class="${x.oos.passed?'pass':'fail'}">${x.oos.passed?'PASS':'FAIL'}</td><td class="${x.gate.pass?'pass':'warn'}">${x.gate.pass?'HIGH':'PAPER'}</td></tr>`}html+='</table>';html+='<div class="small muted" style="margin-top:14px">Gate فقط وقتی HIGH می‌شود که تمام شروط آماری V25/V14 عبور کنند؛ PAPER به معنی مردود بودن موتور نیست، یعنی هنوز شواهد کافی برای پول واقعی نداریم.</div>';$('out').innerHTML=html;window.__V28_BACKTEST=rows;}catch(err){$('out').innerHTML='<span class="fail">خطا: '+esc(err.message)+'</span>';console.error(err)}finally{$('run').disabled=false}}
$('run').onclick=run;
</script></body></html>
